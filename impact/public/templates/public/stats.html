{% extends "base.html" %}
{% load static %}

{% block title %}Statistiques - Portail RSE{% endblock %}

{% block content %}
    <div class="fr-container fr-my-8w">
        <h1>Statistiques d'usage</h1>
        <script src="https://lesentreprises-sengagent-data-warehouse.osc-fr1.scalingo.io/app/iframeResizer.js" nonce="{{ request.csp_nonce }}"></script>
        <iframe
            id="metabaseIframe"
            src="https://lesentreprises-sengagent-data-warehouse.osc-fr1.scalingo.io/public/dashboard/fe50e875-5246-4129-9b32-9a62c6b3ab3b"
            title="Statistiques Portail RSE sur Metabase"
            style="width: 1px; min-width: 100%"
            allowtransparency
        ></iframe>

        <script nonce="{{ request.csp_nonce }}">
            <!-- No `unsafe-inline` CSP by getting the event handler out of the iframe element -->
            document.getElementById('metabaseIframe').onload = iFrameResize({}, '#metabaseIframe');
        </script>
<!-- page stats -->
{% endblock %}
